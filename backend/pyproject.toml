[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "emasdep"
version = "3.0.0"
description = "Enterprise Multi-Agent Spec-Driven Engineering Platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "networkx>=3.0",
    "rich>=13.0",
    "click>=8.0",
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mutmut>=3.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "pre-commit>=3.0",
]
sandbox = [
    "docker>=7.0",
]
all = ["emasdep[dev]", "emasdep[sandbox]"]

[project.scripts]
emasdep = "emasdep.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["emasdep*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
